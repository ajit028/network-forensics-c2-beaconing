title: Suspicious DNS Tunneling / C2 High Entropy Queries
id: 38f9a2c1-4712-4d56-b98a-12e4f6a7b890
status: experimental
description: Detects unusually long DNS query names and high query frequency typical of DNS-based C2 exfiltration or beaconing.
author: Ajit Nayak (SOC Analyst / Threat Hunter)
references:
  - https://attack.mitre.org/techniques/T1071/004/
date: 2026/09/19
tags:
  - attack.command_and_control
  - attack.t1071.004
logsource:
  category: dns
  product: zeek
  service: dns
detection:
  selection:
    query|length: 50
    qtype: 
      - A
      - TXT
      - CNAME
  condition: selection
falsepositives:
  - Content Delivery Networks (CDN) dynamic routing
  - Legitimate encrypted DNS / DoH resolvers
level: high
