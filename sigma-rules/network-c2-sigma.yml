title: Suspicious Periodic C2 Beaconing Activity
id: c7b4e9f2-83a1-4b1e-92fd-e4b2d19f8a32
status: experimental
description: Detects consistent periodic network connection patterns characteristic of Command and Control (C2) beaconing over HTTP/HTTPS or raw TCP.
author: Ajit Nayak (SOC Analyst / Threat Hunter)
references:
  - https://attack.mitre.org/tactics/TA0011/
  - https://attack.mitre.org/techniques/T1071/
date: 2026/09/19
tags:
  - attack.command_and_control
  - attack.t1071
logsource:
  category: firewall
  product: zeek
  service: conn
detection:
  selection:
    proto: tcp
    duration|gte: 60
    # High frequency short bursts or regular intervals indicative of beaconing
    orig_bytes: 
      - 100
      - 500
  condition: selection
falsepositives:
  - Authorized software heartbeat or telemetry check-ins
  - System clock synchronization traffic
level: high
